<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        xmlns:hio="http://typo3.org/ns/Wtl/HioTypo3ConnectorWtl/ViewHelpers"
        data-namespace-typo3-fluid="true" lang="en">

<f:layout name="Default"/>

<f:section name="Main">
    <f:flashMessages/>
    <f:if condition="{doctoralProgram.details}">
        <div class="flex items-stretch justify-between py-4 px-0">
            <h1 class="mt-2 font-normal text-3xl sm:text-4xl px-4">
                <f:translate key="doctoralProgram.show.title" extensionName="HioTypo3ConnectorWtl"/>
            </h1>
        </div>
        <div class="bg-white px-4 py-6 lg:p-8">
            <div class="text-base/7 text-gray-700">
                <p class="font-semibold text-gray-600 py-0">
                    <f:if condition="{doctoralProgram.details.courseOfStudy}">
                        <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.courseOfStudy" />: {doctoralProgram.details.courseOfStudy.name}
                        &middot;
                    </f:if>
                    <f:if condition="{doctoralProgram.details.language}">
                        <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.language" />: {doctoralProgram.details.language.name}
                        &middot;
                    </f:if>
                    <f:if condition="{doctoralProgram.details.startDate}">
                        <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.startDate" />: <f:format.date format="d.m.Y" >{doctoralProgram.details.startDate}</f:format.date>
                        &middot;
                    </f:if>
                    <f:if condition="{doctoralProgram.details.endDate}">
                        <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.endDate" />: <f:format.date format="d.m.Y" >{doctoralProgram.details.endDate}</f:format.date>
                    </f:if>
                </p>
                <h1 class="mt-2 text-pretty text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">{doctoralProgram.title}</h1>
            </div>

            <div class="mt-6 border-t border-gray-100">
                <dl class="divide-y divide-gray-100">
                    <div class="py-6 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm/6 font-medium text-gray-900"><f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.persons" /></dt>
                        <dd class="mt-1 text-sm/6 text-gray-700 sm:col-span-2 sm:mt-0">
                            <f:for each="{doctoralProgram.details.persons}" as="detailPerson">
                                <span>
                                    <f:variable name="basePerson" value="{hio:findByProperty(haystack: doctoralProgram.persons, property: 'objectId', value: detailPerson.id)}"/>
                                    <f:render partial="DoctoralProgram/Show/PersonLink" arguments="{person: detailPerson, uid: basePerson.uid}" />
                                </span>
                            </f:for>
                        </dd>
                    </div>
                    <div class="py-6 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm/6 font-medium text-gray-900"><f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.description" /></dt>
                        <dd class="mt-1 text-sm/6 text-gray-700 sm:col-span-2 sm:mt-0">
                                {doctoralProgram.details.description}
                        </dd>
                    </div>
                    <div class="py-6 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm/6 font-medium text-gray-900">
                            <f:if condition="{doctoralProgram.details.subjectAreas -> f:count()} == 1">
                                <f:then>
                                    <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.subjectArea" />
                                </f:then>
                                <f:else>
                                    <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.subjectAreas" />
                                </f:else>
                            </f:if>
                        </dt>
                        <dd class="mt-1 text-sm/6 text-gray-700 sm:col-span-2 sm:mt-0">
                            <f:for each="{doctoralProgram.details.subjectAreas}" as="subject" key="index">
                                <p class="py-0">
                                    {subject.name}
                                </p>
                            </f:for>
                        </dd>
                    </div>
                    <f:if condition="{doctoralProgram.details.researchAreas}">
                        <div class="py-6 sm:grid sm:grid-cols-3 sm:gap-4">
                            <dt class="text-sm/6 font-medium text-gray-900">
                                <f:if condition="{doctoralProgram.details.researchAreas -> f:count()} == 1">
                                    <f:then>
                                        <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.researchArea" />
                                    </f:then>
                                    <f:else>
                                        <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/doctoralProgram.xlf:doctoralProgram.researchAreas" />
                                    </f:else>
                                </f:if>
                            </dt>
                            <dd class="mt-1 text-sm/6 text-gray-700 sm:col-span-2 sm:mt-0">
                                <f:for each="{doctoralProgram.details.researchAreas}" as="researchArea" key="index">
                                    <span class="inline-flex items-center rounded-md bg-gray-50 px-2 py-1 mb-2 mr-1 text-sm font-medium text-gray-600 ring-1 ring-inset ring-gray-500/10">{researchArea.name}</span>
                                </f:for>
                            </dd>
                        </div>
                    </f:if>
                </dl>
            </div>

            <f:if condition="{doctoralProgram.details.dynamicObjects}">
                <f:then>
                    <f:render partial="DynamicObjects" arguments="{dynamicObjects: doctoralProgram.details.dynamicObjects}" />
                </f:then>
            </f:if>

        </div>
    </f:if>
    <div class="px-4 py-5 sm:p-6">
        <nav class="flex items-center justify-between border-t border-gray-200 px-4 sm:px-0">
            <div class="-mt-px flex w-0 flex-1">
                <f:render partial="Navigation/BackButton" />
            </div>
        </nav>
    </div>

</f:section>

</html>

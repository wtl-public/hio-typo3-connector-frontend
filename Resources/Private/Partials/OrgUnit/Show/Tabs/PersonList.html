<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        xmlns:hio="http://typo3.org/ns/Wtl/HioTypo3ConnectorWtl/ViewHelpers"
        data-namespace-typo3-fluid="true" lang="en">

<f:if condition="{detailPersons}">
        <f:then>
            <div class="overflow-hidden">
                <ul role="list" class="divide-y divide-gray-100">
                <f:for each="{detailPersons}" as="detailPerson">
                    <f:variable name="basePerson" value="{hio:findByProperty(haystack: persons, property: 'objectId', value: detailPerson.id)}"/>
                    <f:render partial="OrgUnit/Show/Tabs/PersonListItem" arguments="{person:detailPerson, uid: basePerson.uid}" />
                </f:for>
                </ul>
            </div>
    </f:then>

    <f:else>
        <div class="no-comment alert alert-info">
            <f:translate key="LLL:EXT:hio_typo3_connector/Resources/Private/Language/orgUnit.xlf:noPersons"/>
        </div>
    </f:else>
</f:if>

</html>
